<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>TecnoShop</h1>
        <p>Tu tienda de tecnología</p>
    </header>

    <main>
        <section>
            <h2>Productos destacados</h2>

            <div class="productos">
                <article class="producto">
                    <h3>Audífonos Bluetooth</h3>
                    <p>Audífonos inalámbricos con sonido de alta calidad.</p>
                    <strong>$80.000</strong>
                </article>

                <article class="producto">
                    <h3>Teclado mecánico</h3>
                    <p>Teclado compacto ideal para estudiar y trabajar.</p>
                    <strong>$150.000</strong>
                </article>

                <article class="producto">
                    <h3>Mouse inalámbrico</h3>
                    <p>Mouse cómodo para uso diario.</p>
                    <strong>$60.000</strong>
                </article>
            </div>
        </section>

        <button id="mensajeBtn">Ver mensaje</button>
        <p id="mensaje"></p>
    </main>

    <footer>
        <p>&copy; 2026 TecnoShop</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
